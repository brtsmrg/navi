# Free HTTPS hosting for the installable web app (the fastest way to test on an iPhone or Android phone).
# Needs: repo Settings > Pages > Source = "GitHub Actions". Public repos are free; private repos need a paid plan.
# Two jobs on purpose: when building and deploying shared one job, GitHub sometimes could not find the just-uploaded
# artifact ("No artifacts named github-pages were found") and the deploy failed. A separate deploy job avoids that.
name: Deploy web app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
